<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{ game["name"] }} — GameVault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

</head>

<body class="game-page">

    <main class="details-container">

        <a
            class="back-link"
            href="{{ url_for('index') }}"
        >
             Назад к играм
        </a>

        <section class="details-card">

            <div class="details-image-block">

                <img
                    class="details-image"
                    src="{{ game['image'] }}"
                    alt="{{ game['name'] }}"
                >

            </div>

            <div class="details-info">

                <h1>
                    {{ game["name"] }}
                </h1>
                <p>
                    <strong>Жанр:</strong>
                    {{ game["genre"] }}
                </p>


                <p class="rating">
                    <strong>Рейтинг:</strong>
                    {% for star in range(1, 11) %}
                        {% if star <= game["rating"] %}
                            <span class='star active-star'>★</span>
                        {% else %}
                            <span class="star">★</span>
                        {% endif %}
                    {% endfor %}
                    <span class="rating-number">
                        {{ game["rating"] }}/10
                    </span>
                </p>

                <p>
                    <strong>Статус:</strong>

                    <span class="status-badge status-{{ game['status'] | replace(' ', '-') | lower }}">
                        {{ game["status"] }}
                    </span>
                </p>
                <h2>
                    Об игре
                </h2>
                <p class="details-description">
                    {{ game["description"] }}
                </p>
                <a class="edit-button"
                        href="{{ url_for('edit_game', game_id=game_id) }}"
                >
                     Редактировать
                </a>
                <form
                    method="POST"
                    action="{{ url_for('delete_game', game_id=game_id) }}"
                    onsubmit="return confirm('Точно удалить игру {{ game.name }}?')"
                >
                    <button
                        class="delete-button"
                        type="submit"
                    >
                         Удалить игру
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
